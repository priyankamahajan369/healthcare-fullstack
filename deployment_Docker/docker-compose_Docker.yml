# This Docker Compose file starts the complete system.
services:
  patient-db:
    image: postgres:16
    environment:
      POSTGRES_DB: patientdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5433:5432"]
  appointment-db:
    image: postgres:16
    environment:
      POSTGRES_DB: appointmentdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5434:5432"]
  patient-service:
    build:
      context: ..
      dockerfile: deployment_Docker/patient-service_Dockerfile
    environment:
      PATIENT_DB_URL: jdbc:postgresql://patient-db:5432/patientdb
    ports: ["8081:8081"]
    depends_on: [patient-db]
  appointment-service:
    build:
      context: ..
      dockerfile: deployment_Docker/appointment-service_Dockerfile
    environment:
      APPOINTMENT_DB_URL: jdbc:postgresql://appointment-db:5432/appointmentdb
      PATIENT_SERVICE_URL: http://patient-service:8081
    ports: ["8082:8082"]
    depends_on: [appointment-db, patient-service]
  frontend:
    build:
      context: ..
      dockerfile: deployment_Docker/frontend_Dockerfile
    environment:
      VITE_PATIENT_API: http://localhost:8081/api
      VITE_APPOINTMENT_API: http://localhost:8082/api
    ports: ["3000:5173"]
    depends_on: [patient-service, appointment-service]
