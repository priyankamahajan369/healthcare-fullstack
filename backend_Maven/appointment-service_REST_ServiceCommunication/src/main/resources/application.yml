# This sets the Appointment Service port.
server:
  port: 8082
# This configures the appointment PostgreSQL database.
spring:
  datasource:
    url: ${APPOINTMENT_DB_URL:jdbc:postgresql://localhost:5434/appointmentdb}
    username: ${APPOINTMENT_DB_USER:postgres}
    password: ${APPOINTMENT_DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
# This URL is injected into PatientClient_ServiceCommunication.
patient-service:
  base-url: ${PATIENT_SERVICE_URL:http://localhost:8081}
